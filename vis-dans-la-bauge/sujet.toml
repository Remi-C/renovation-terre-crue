# Description du sujet « Vis dans la bauge », lue par outils/construire.py pour l'accueil du site et les pages du sujet.
# Un nouveau sujet = un nouveau dossier à la racine avec son propre sujet.toml (même clés), son papier/, ses site/*.md.

ordre = 1
# Scripts de code/ relancés par `make construire`, dans cet ordre, depuis la racine du dépôt.
scripts = ["grandeurs.py", "figures_essais.py", "figure_pre_trou.py", "figure_profondeur.py", "schemas.py"]

[fr]
titre = "Vis dans la bauge"
accroche = "Peut-on visser dans la bauge ? Quelles vis, quelle longueur, combien ça tient de côté : essais sur un mur existant, avec du matériel courant."
etat = "Essais de cisaillement faits le 30/10/2026, papier de référence en ligne. Essais d'arrachement à venir (novembre 2026)."

[en]
titre = "Screws in cob"
accroche = "Can you screw into cob? Which screws, what length, how much they hold sideways: tests on an existing wall, with ordinary tools."
etat = "Lateral load tests done on 30 Oct. 2026, reference paper online. Pull-out tests to come (November 2026)."

# Figures du sujet (fichiers figures/<id>.png et .svg, produits par code/) et leur légende sur la page « Données et code ».
