# Nom du dépôt public et compte GitHub : le seul endroit où les écrire.
# L'adresse du dépôt (https://github.com/<COMPTE_GITHUB>/<NOM_DEPOT>) et celle du site
# (https://<compte en minuscules>.github.io/<NOM_DEPOT>/) en sont déduites.
# Pour changer de nom AVANT la création du dépôt : make renommer NOM=<nouveau-nom>, puis make construire.
# Lu par le Makefile, par outils/*.sh (source) et par outils/publication.py : syntaxe CLE=valeur, sans espace ni guillemet.
COMPTE_GITHUB=Remi-C
NOM_DEPOT=renovation-terre-crue
# Après la première version sur Zenodo : le DOI « toutes versions » (concept DOI), ex. 10.5281/zenodo.1234567.
# Repris par make construire dans CITATION.cff, la page « Données et code » et la citation. Vide tant qu'il n'existe pas.
DOI=
# Identifiant ORCID de l'auteur, s'il en a un (ex. 0000-0002-1825-0097) ; repris dans CITATION.cff et .zenodo.json.
ORCID=
# Contact public, facultatif : une adresse e-mail ou l'adresse d'une page de contact, sans espace. Vide = les retours
# passent par les issues GitHub seules. Rempli : make construire l'affiche dans le pied de toutes les pages du site et
# dans « Vos retours » des accueils, et make verifier autorise cette seule adresse e-mail dans le dépôt.
CONTACT=
