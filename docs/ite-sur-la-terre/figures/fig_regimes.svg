  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(7.2 338.362531)">Limites des bandes approximatives. Points : pesées du 18/11/2026 dans des murs secs, barres = incertitude. Façade sud : seule</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(7.2 350.765266)">sa peau est pesée (5,3 % sur 20 cm) ; barre : de l'état central de nos calculs (cœur à 3,0 %) à l'état haut (5,3 % partout).</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(7.2 363.168)">Humidités relatives : courbe de rétention d'une bauge de laboratoire, non mesurée sur ces murs.</text>
  </g>
