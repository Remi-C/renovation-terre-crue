# Description du sujet « Vis dans la bauge », lue par outils/construire.py pour l'accueil du site et les pages du sujet.
# Un nouveau sujet = un nouveau dossier à la racine avec son propre sujet.toml (même clés), son papier/, ses site/*.md.

ordre = 1
# Scripts de code/ relancés par `make construire`, dans cet ordre, depuis la racine du dépôt.
scripts = ["grandeurs.py", "figures_essais.py", "figure_pre_trou.py", "figure_tenue.py", "schemas.py"]

[fr]
titre = "Vis dans la bauge"
accroche = "Peut-on visser dans la bauge ? Quelles vis, quelle longueur, combien ça tient, de côté et en traction : essais sur un mur existant, avec du matériel courant."
etat = "Essais de côté (30/10/2026) et en traction (07/11/2026) faits, papier de référence en ligne ; mesures mises à côté de ce que conseillent les textes, sans charge sûre."

[en]
titre = "Screws in cob"
accroche = "Can you screw into cob? Which screws, what length, how much they hold, sideways and in pull-out: tests on an existing wall, with ordinary tools."
etat = "Sideways (30 Oct. 2026) and pull-out (7 Nov. 2026) tests done, reference paper online; measurements set next to what published texts advise, with no safe load."

