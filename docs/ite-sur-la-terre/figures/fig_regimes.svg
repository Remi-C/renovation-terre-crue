    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(121.493203 43.167104)">sous enduit,</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(132.9375 56.369252)">ça passe</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(296.456797 29.964955)">Un peu au-dessus</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(291.473281 43.607963)">sécher le mur l'été,</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(244.196484 57.250971)">puis isoler sous enduit en fin d'été</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(510.509844 29.964955)">Trop humide, ou</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(508.688828 43.607963)">remontées d'eau</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(507.439297 57.250971)">parement ventilé</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(507.815703 70.893979)">(bois ou minéral)</text>
   </g>
